[project]
name = "simulation-systems"
version = "0.1.0"
description = "Simulation Systems Working Practices & Discussions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydata-sphinx-theme==0.16.1",
    "sphinx==8.2.3",
    "sphinx-design==0.6.1",
    "sphinx-copybutton==0.5.2",
    "sphinx-lint==1.0.2",
    "sphinx-sitemap==2.9.0",
    "sphinxcontrib-svg2pdfconverter==1.3.0",
    "sphinxcontrib-mermaid==1.1.0",
]

[project.urls]
repository = "https://github.com/MetOffice/simulation-systems"
documentation = "https://metoffice.github.io/simulation-systems/"
discussion = "https://github.com/MetOffice/simulation-systems/discussions"

[tool.setuptools]
packages = []
